name: Build Extension VSIX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VSCODE_CHECKOUT: ${{ github.workspace }}/.build/vscode-byok
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Assemble pinned VS Code checkout
        run: bash script/prepareUpstreamCheckout.sh "$VSCODE_CHECKOUT"

      - name: Install dependencies
        working-directory: ${{ env.VSCODE_CHECKOUT }}/extensions/copilot
        run: npm ci

      - name: Typecheck
        working-directory: ${{ env.VSCODE_CHECKOUT }}/extensions/copilot
        run: npm run typecheck

      - name: Run local BYOK tests
        working-directory: ${{ env.VSCODE_CHECKOUT }}/extensions/copilot
        run: >-
          npx vitest run
          src/extension/byok/common/test/byokAutoRouter.spec.ts
          src/extension/byok/common/test/byokFailover.spec.ts
          src/extension/byok/common/test/byokRoutingHeuristics.spec.ts
          src/extension/byok/common/test/contextBreakdown.spec.ts
          src/extension/byok/common/test/dsmlToolCallStripper.spec.ts
          src/extension/byok/common/test/geminiErrorUtils.spec.ts
          src/extension/byok/common/test/geminiMessageConverter.spec.ts
          src/extension/byok/vscode-node/test/byokAutoProvider.spec.ts
          src/extension/byok/vscode-node/test/byokFusionProvider.spec.ts
          src/extension/byok/vscode-node/test/byokRoutingClassifier.spec.ts
          src/extension/byok/vscode-node/test/byokOTelHelpers.spec.ts
          src/extension/byok/vscode-node/test/geminiInteractionProvider.spec.ts
          src/extension/byok/vscode-node/test/openRouterProvider.spec.ts

      - name: Build extension
        working-directory: ${{ env.VSCODE_CHECKOUT }}/extensions/copilot
        run: npm run build

      - name: Package extension
        working-directory: ${{ env.VSCODE_CHECKOUT }}/extensions/copilot
        run: npx vsce package --no-dependencies -o copilot-custom-build.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: copilot-custom-build
          path: ${{ env.VSCODE_CHECKOUT }}/extensions/copilot/copilot-custom-build.vsix
